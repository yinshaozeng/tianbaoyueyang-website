    <h1>天津越洋机械有限公司 | Tianjin Yueyang Machinery Manufacturing Co., Ltd.</h1>
    <p>天津越洋机械有限公司专注于喷射沉积及新材料研发，核心团队深耕行业20余年，研发团队30余人（博士5人、硕士15人），具备ISO认证。主要产品：喷射沉积锭坯设备、气体保护制备粉末设备、喷射沉积管坯设备，以及挤压型材、轧制板材、轻量化刹车盘。锭坯和管坯平均晶粒尺寸20-50微米，可生产铜合金、钢合金、铝合金；气体保护制粉设备可生产5-15微米细粉（CE合金、铝基复合材料、碳化硅铝），用于半导体、电子封装和光通信。可私有化定制，也可以联合开发。地址：天津市宝坻区节能环保工业区宝中道7号，邮编301800。电话：0086-22-22539988。邮箱：admin@tianbaoyueyang.com。</p>
    <p>Tianjin Yueyang Machinery Manufacturing Co., Ltd. focuses on spray deposition (spray forming) and new materials R&amp;D. Our core team has 20+ years in the industry, with an R&amp;D team of 30+ people (5 PhDs, 15 Masters), and the company is ISO certified. Products: spray deposition ingot (billet) equipment, gas-protected powder preparation equipment, spray deposition tube billet equipment, as well as extruded profiles, rolled sheets and lightweight brake discs. Ingot and tube billet equipment produces copper, steel and aluminum alloys with an average grain size of 20-50 microns; the gas-protected powder equipment produces 5-15 micron fine powders (CE alloys, aluminum matrix composites, SiC/Al) for semiconductor, electronic packaging and optical communication applications. Custom equipment and joint development are available. Address: No.7 Baozhong Road, Energy-saving and Environmental Protection Industrial Zone, Baodi District, Tianjin 301800, China. Tel: 0086-22-22539988. Email: admin@tianbaoyueyang.com.</p>
